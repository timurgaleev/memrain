name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PII audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: make audit
        run: make audit
      - name: make scrub-audit
        run: make scrub-audit
      - name: migration search_path guard
        run: bash scripts/check-search-path.sh

  bash-tests:
    name: Bash unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: make test
        run: make test

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.6.6"
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint scripts
        run: shellcheck scripts/*.sh tests/*.test.sh tests/lib/*.sh deploy/*.sh deploy/lib/*.sh deploy/secrets/*.sh deploy/memrain/scripts/*.sh

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: pytest
        run: pytest tests/test_*.py -v

  bun-tests:
    # The gate. Production is arm64 (t4g.medium); that leg runs nightly in
    # bun-arm64.yml instead, because a free arm64 runner took 3-4x as long and
    # set the wall clock of every push without gating anything.
    name: Memrain Bun tests (amd64 ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    # A group runs in ~5 min now that tests copy a pre-migrated database. A
    # tight cap makes a regression that hangs fail fast; the runner has no
    # wall-clock budget here, so every file dealt to the group runs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Files are dealt longest-first by tests/.timings.tsv, so the three
        # groups take about the same time.
        group: [0, 1, 2]
    defaults:
      run:
        working-directory: deploy/memrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: typecheck
        # Runs BEFORE the suite: a type error is cheaper to read than a shard
        # failure, and until this step existed the compiler had never been run
        # over the repo at all — its first run found a real defect in `doctor`.
        # Covers tests/ too. That is not tidiness: a test that indexes an array
        # it never proved non-empty is a test that passes when the query returns
        # nothing, and closing this backlog turned up exactly one of those.
        run: bun run typecheck
      - name: bun test (sharded)
        # The loop lives in scripts/test-sharded.sh so CI and the local ship
        # gate run the SAME sharding — the whole suite in one `bun test`
        # process exhausts memory (see the script header for why), which is
        # not a CI-only constraint.
        env:
          # Default bun per-test timeout (5s) — amd64 is the gate, so keep it
          # tight to catch genuine perf regressions.
          TEST_TIMEOUT: "5000"
          MAX_SECONDS: "0"
          SHARD_SIZE: "20"
          SHARD_GROUPS: "3"
          SHARD_GROUP: ${{ matrix.group }}
        run: bash scripts/test-sharded.sh

  postgres-tests:
    # The Postgres-only tests and a double migration apply against a real
    # Postgres 16 + pgvector, where transactions really run concurrently
    # (PGLite serializes them).
    name: Postgres tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memrain
          POSTGRES_PASSWORD: memrain
          POSTGRES_DB: memrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U memrain -d memrain_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: bun install (frozen lockfile)
        working-directory: deploy/memrain
        run: bun install --frozen-lockfile
      - name: make test-pg
        # With the URL set, the script uses the service container and starts
        # none of its own.
        env:
          MEMRAIN_TEST_POSTGRES_URL: postgres://memrain:memrain@127.0.0.1:5432/memrain_test?sslmode=disable
        run: make test-pg
