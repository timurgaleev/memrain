name: SBOM

# Attaches two CycloneDX SBOMs to every published GitHub release: the
# production Bun dependencies of the server and of the admin panel, which is
# what the image ships. Not continue-on-error: a release without its SBOM must
# show up as a red run. It never gates shipping; the release already exists.
#
# Dependency code never sees a write token. `generate` installs packages with
# the read-only token and lifecycle scripts off; `publish` holds
# `contents: write` but checks nothing out and installs nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)attach the SBOM to, e.g. v1.9.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  generate:
    name: generate CycloneDX SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SYFT_VERSION: "1.54.1"
      SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
      SYFT_CHECK_FOR_APP_UPDATE: "false"
      SYFT_FILE_METADATA_SELECTION: none
    steps:
      - name: validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Same Bun as the runtime image (deploy/memrain/Dockerfile).
          bun-version: "1.3.13"
      - name: install syft
        # A release binary checked against a hardcoded checksum, as in
        # supply-chain.yml: nothing outside this file decides what runs.
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o syft.tar.gz \
            "${GITHUB_SERVER_URL}/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: production installs
        # Each graph is installed in a staging dir holding only its manifest,
        # lockfile and patches, so the BOM lists exactly the frozen
        # production install and no stray package.json from the checkout.
        run: |
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/server" "$STAGE/admin"
          cp deploy/memrain/package.json deploy/memrain/bun.lock deploy/memrain/bunfig.toml "$STAGE/server/"
          cp -R deploy/memrain/patches "$STAGE/server/"
          cp deploy/memrain/admin/package.json deploy/memrain/admin/bun.lock "$STAGE/admin/"
          (cd "$STAGE/server" && bun install --frozen-lockfile --production --ignore-scripts)
          (cd "$STAGE/admin" && bun install --frozen-lockfile --production --ignore-scripts)
      - name: generate SBOMs
        # The installed-package cataloger reads node_modules; the bun.lock
        # cataloger would also list dev-only transitive packages. File
        # entries are left out: the BOM lists packages only.
        run: |
          STAGE="$RUNNER_TEMP/stage"
          OUT="$RUNNER_TEMP/sbom"
          mkdir -p "$OUT"
          syft scan "dir:$STAGE/server" --override-default-catalogers javascript-package-cataloger --select-catalogers=-file \
            --source-name memrain-server --source-version "$TAG" \
            -o "cyclonedx-json=$OUT/memrain-$TAG-server.cdx.json"
          syft scan "dir:$STAGE/admin" --override-default-catalogers javascript-package-cataloger --select-catalogers=-file \
            --source-name memrain-admin --source-version "$TAG" \
            -o "cyclonedx-json=$OUT/memrain-$TAG-admin.cdx.json"
          cd "$OUT"
          # An empty BOM is a failure, not an artifact.
          jq -e '[.components[] | select(.name == "postgres")] | length == 1' "memrain-$TAG-server.cdx.json" > /dev/null
          jq -e '[.components[] | select(.name == "react")] | length == 1' "memrain-$TAG-admin.cdx.json" > /dev/null
          for f in memrain-"$TAG"-*.cdx.json; do
            echo "$f: $(jq '[.components[] | select(.type == "library")] | length' "$f") packages"
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach to release
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          cd sbom
          sha256sum -c memrain-"$TAG"-*.cdx.json.sha256
          gh release upload "$TAG" memrain-"$TAG"-*.cdx.json memrain-"$TAG"-*.cdx.json.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
