<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" width="1400" height="660" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Memrain architecture: AI agents connect through a Cloudflare Tunnel or Caddy to one EC2 instance in your AWS account, which uses RDS Postgres with pgvector, EFS, Amazon Bedrock and Secrets Manager.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#070A14"/></marker></defs>
<rect width="1400" height="660" rx="20" fill="#F4F5F8"/>
<text x="40" y="54" font-size="26" font-weight="700" fill="#070A14">Where Memrain runs</text>
<rect x="40" y="250" width="230" height="150" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="60" y="284" font-size="19" font-weight="700" fill="#070A14">Your AI agents</text>
<text x="60" y="312" font-size="14.5" fill="#5B6478">Claude Code, Claude.ai,</text>
<text x="60" y="334" font-size="14.5" fill="#5B6478">ChatGPT, Codex — any</text>
<text x="60" y="356" font-size="14.5" fill="#5B6478">MCP client</text>
<rect x="330" y="250" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="350" y="284" font-size="19" font-weight="700" fill="#070A14">Public endpoint</text>
<text x="350" y="312" font-size="14.5" fill="#5B6478">Cloudflare Tunnel</text>
<text x="350" y="334" font-size="14.5" fill="#5B6478">(no open ports), or</text>
<text x="350" y="356" font-size="14.5" fill="#5B6478">Caddy with TLS</text>
<line x1="272" y1="325" x2="326" y2="325" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<text x="299" y="312" font-size="13" fill="#5B6478" text-anchor="middle">HTTPS</text>
<rect x="580" y="90" width="790" height="530" rx="18" fill="none" stroke="#D8DCE4" stroke-width="2" stroke-dasharray="8 6"/>
<text x="604" y="122" font-size="16" font-weight="700" fill="#5B6478">Your AWS account · built by Terraform</text>
<rect x="610" y="150" width="330" height="290" rx="16" fill="#F4F5F8" stroke="#D8DCE4" stroke-width="2"/>
<text x="630" y="182" font-size="19" font-weight="700" fill="#070A14">EC2 instance</text><text x="630" y="204" font-size="14" fill="#5B6478">t4g.medium by default, Docker</text>
<rect x="630" y="222" width="290" height="110" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="650" y="256" font-size="19" font-weight="700" fill="#070A14">memrain container</text>
<text x="650" y="284" font-size="14.5" fill="#5B6478">MCP server, OAuth, indexer,</text>
<text x="650" y="306" font-size="14.5" fill="#5B6478">background jobs</text>
<rect x="630" y="344" width="290" height="80" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="650" y="378" font-size="19" font-weight="700" fill="#070A14">cloudflared container</text>
<text x="650" y="406" font-size="14.5" fill="#5B6478">outbound tunnel</text>
<line x1="532" y1="340" x2="626" y2="384" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<text x="578" y="350" font-size="13" fill="#5B6478" text-anchor="middle">MCP</text>
<rect x="1010" y="150" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="1030" y="184" font-size="19" font-weight="700" fill="#070A14">RDS Postgres 16 + pgvector</text>
<text x="1030" y="212" font-size="14.5" fill="#5B6478">pages, passages, embeddings,</text>
<text x="1030" y="234" font-size="14.5" fill="#5B6478">facts, tokens · encrypted</text>
<rect x="1010" y="280" width="330" height="110" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="1030" y="314" font-size="19" font-weight="700" fill="#070A14">Amazon Bedrock</text>
<text x="1030" y="342" font-size="14.5" fill="#5B6478">Titan embeddings,</text>
<text x="1030" y="364" font-size="14.5" fill="#5B6478">Claude Haiku for query help</text>
<rect x="1010" y="410" width="330" height="90" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="1030" y="444" font-size="19" font-weight="700" fill="#070A14">EFS</text>
<text x="1030" y="472" font-size="14.5" fill="#5B6478">config, notes folder, code checkout</text>
<rect x="610" y="470" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="630" y="504" font-size="19" font-weight="700" fill="#070A14">Secrets Manager + IAM</text>
<text x="630" y="532" font-size="14.5" fill="#5B6478">DB URL and tokens,</text>
<text x="630" y="554" font-size="14.5" fill="#5B6478">instance role scoped to</text>
<text x="630" y="576" font-size="14.5" fill="#5B6478">its own resources</text>
<rect x="1010" y="520" width="330" height="80" rx="14" fill="#FFFFFF" stroke="#D8DCE4" stroke-width="2"/>
<text x="1030" y="554" font-size="19" font-weight="700" fill="#070A14">Backups and logs</text>
<text x="1030" y="582" font-size="14.5" fill="#5B6478">RDS snapshots, EFS backup, logs</text>
<line x1="922" y1="277" x2="1006" y2="205" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="922" y1="290" x2="1006" y2="335" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="922" y1="300" x2="1006" y2="455" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="775" y1="442" x2="775" y2="466" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="900" y1="344" x2="900" y2="336" stroke="#070A14" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
